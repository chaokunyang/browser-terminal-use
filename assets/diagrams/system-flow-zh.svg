<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Browser Terminal Use 系统运行流程图（中文）</title>
  <desc id="desc">从本地 CLI 到浏览器终端执行，再返回输出与退出码的端到端流程。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #334155; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .lane-title { font: 700 17px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .box-alt { fill: #ffffff; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .box-core { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .txt { font: 14px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #0f172a; }
      .txt-small { font: 13px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #334155; }
      .arrow { stroke: #1e293b; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead); }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; rx: 10; }
      .note-txt { font: 13px 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="780" />
  <text class="title" x="36" y="48">Browser Terminal Use：系统运行流程</text>
  <text class="subtitle" x="36" y="76">CLI 发起请求 -> 守护进程排队 -> 扩展注入命令 -> 浏览器终端执行 -> 解析输出与退出码</text>

  <rect class="lane" x="28" y="106" width="220" height="620" />
  <text class="lane-title" x="48" y="138">本地 macOS</text>

  <rect class="lane" x="270" y="106" width="250" height="620" />
  <text class="lane-title" x="292" y="138">Bridge 守护进程</text>

  <rect class="lane" x="542" y="106" width="300" height="620" />
  <text class="lane-title" x="564" y="138">Chrome 扩展</text>

  <rect class="lane" x="864" y="106" width="500" height="620" />
  <text class="lane-title" x="886" y="138">浏览器终端页面 / 远端 Shell</text>

  <rect class="box" x="52" y="182" width="170" height="92" />
  <text class="txt" x="66" y="212">1) browterm exec</text>
  <text class="txt-small" x="66" y="236">发送命令与超时参数</text>
  <text class="txt-small" x="66" y="256">携带 token / client-id</text>

  <rect class="box" x="292" y="182" width="206" height="92" />
  <text class="txt" x="306" y="212">2) 鉴权并入队</text>
  <text class="txt-small" x="306" y="236">同一时刻仅一个活动请求</text>
  <text class="txt-small" x="306" y="256">队列保证执行顺序确定</text>

  <rect class="box-core" x="292" y="308" width="206" height="116" />
  <text class="txt" x="306" y="338">3) core 包装命令</text>
  <text class="txt-small" x="306" y="362">__BT_START_id__</text>
  <text class="txt-small" x="306" y="382">( 用户命令 ); rc=$?</text>
  <text class="txt-small" x="306" y="402">__BT_RC_id__:rc + __BT_END_id__</text>

  <rect class="box" x="564" y="182" width="256" height="92" />
  <text class="txt" x="578" y="212">4) 定位已绑定终端标签页</text>
  <text class="txt-small" x="578" y="236">service worker 分发请求</text>
  <text class="txt-small" x="578" y="256">到 content script</text>

  <rect class="box-alt" x="564" y="308" width="256" height="116" />
  <text class="txt" x="578" y="338">5) 注入并触发执行</text>
  <text class="txt-small" x="578" y="362">优先：Chrome Debugger API</text>
  <text class="txt-small" x="578" y="382">回退：合成键盘输入</text>
  <text class="txt-small" x="578" y="402">发送 Enter 执行命令</text>

  <rect class="box" x="886" y="182" width="220" height="92" />
  <text class="txt" x="900" y="212">6) 终端执行命令</text>
  <text class="txt-small" x="900" y="236">远端 shell 执行包装后</text>
  <text class="txt-small" x="900" y="256">的真实用户命令</text>

  <rect class="box-alt" x="1128" y="182" width="210" height="92" />
  <text class="txt" x="1142" y="212">7) 捕获输出流</text>
  <text class="txt-small" x="1142" y="236">优先抓取 websocket 流量</text>
  <text class="txt-small" x="1142" y="256">回退 DOM 变更监听</text>

  <rect class="box-core" x="886" y="308" width="452" height="116" />
  <text class="txt" x="900" y="338">8) core 解析输出</text>
  <text class="txt-small" x="900" y="362">识别 START/RC/END marker，剥离包装内容</text>
  <text class="txt-small" x="900" y="382">提取干净 stdout/stderr 与退出码</text>
  <text class="txt-small" x="900" y="402">增量输出回传给守护进程</text>

  <rect class="box" x="292" y="470" width="206" height="92" />
  <text class="txt" x="306" y="500">9) Bridge 回传结果</text>
  <text class="txt-small" x="306" y="524">流式转发输出与进度</text>
  <text class="txt-small" x="306" y="544">最终附带退出码</text>

  <rect class="box" x="52" y="470" width="170" height="92" />
  <text class="txt" x="66" y="500">10) CLI 显示并退出</text>
  <text class="txt-small" x="66" y="524">实时打印输出</text>
  <text class="txt-small" x="66" y="544">退出码与远端一致</text>

  <rect class="note" x="52" y="604" width="1286" height="94" />
  <text class="note-txt" x="70" y="634">超时 / 取消流程：</text>
  <text class="note-txt" x="70" y="656">CLI 可主动 cancel，守护进程也会按 timeout 强制结束。若未识别到 marker 或协议不兼容，会返回解析/采集错误。</text>
  <text class="note-txt" x="70" y="678">当前请求结束后队列继续推进，保证系统可恢复和可预测。</text>

  <path class="arrow" d="M222 228 L292 228" />
  <path class="arrow" d="M498 228 L564 228" />
  <path class="arrow" d="M498 366 L564 366" />
  <path class="arrow" d="M820 228 L886 228" />
  <path class="arrow" d="M1106 228 L1128 228" />
  <path class="arrow" d="M1230 274 L1230 308" />
  <path class="arrow" d="M886 366 L820 366" />
  <path class="arrow" d="M564 366 L520 366 L520 516 L498 516" />
  <path class="arrow" d="M292 516 L222 516" />

  <path class="arrow-dashed" d="M136 274 L136 470" />
  <path class="arrow-dashed" d="M394 274 L394 308" />
  <path class="arrow-dashed" d="M394 424 L394 470" />
</svg>
