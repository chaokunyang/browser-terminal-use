name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Verify built packages can be globally installed and executed
        shell: bash
        run: |
          set -euo pipefail

          PREFIX_DIR="$(mktemp -d)"
          cleanup() {
            rm -rf "$PREFIX_DIR"
            rm -f browser-terminal-use-core-*.tgz
            rm -f browser-terminal-use-bridge-*.tgz
            rm -f browser-terminal-use-cli-*.tgz
          }
          trap cleanup EXIT

          CORE_TGZ="$(npm pack --workspace @browser-terminal-use/core | tail -n1)"
          BRIDGE_TGZ="$(npm pack --workspace @browser-terminal-use/bridge | tail -n1)"
          CLI_TGZ="$(npm pack --workspace @browser-terminal-use/cli | tail -n1)"

          npm install -g --prefix "$PREFIX_DIR" "./$CORE_TGZ" "./$BRIDGE_TGZ" "./$CLI_TGZ"

          "$PREFIX_DIR/bin/browterm" --help
          "$PREFIX_DIR/bin/browterm-daemon" --help

      - name: Run tests
        run: npm run test
